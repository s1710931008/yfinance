name: 00631L prediction

on:
  workflow_dispatch:
  schedule:
    # 16:30 Asia/Taipei, Monday-Friday (GitHub cron uses UTC).
    - cron: "30 8 * * 1-5"

permissions:
  contents: read

concurrency:
  group: 00631l-prediction
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Restore prediction database
        uses: actions/cache/restore@v4
        with:
          path: artifacts/predictions.sqlite3
          key: predictions-${{ github.run_id }}
          restore-keys: |
            predictions-

      - name: Seed prediction database
        run: |
          mkdir -p artifacts
          if [ ! -f artifacts/predictions.sqlite3 ]; then
            cp predictions.sqlite3 artifacts/predictions.sqlite3
          fi

      - name: Run 00631L walk-forward analysis
        run: |
          set -o pipefail
          python scripts/predict.py 00631L.TW \
            --period 10y \
            --horizon 5 \
            --target 0.04 \
            --adverse -0.025 \
            --folds 5 \
            --database artifacts/predictions.sqlite3 \
            --output-json artifacts/validation.json \
            2>&1 | tee artifacts/predict.log

      - name: Save prediction database cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: artifacts/predictions.sqlite3
          key: predictions-${{ github.run_id }}

      - name: Upload analysis outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 00631L-analysis-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

