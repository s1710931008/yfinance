name: 00631L prediction

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/predict.yml
      - public/**
      - scripts/**
      - tests/**
      - requirements.txt
  schedule:
    # 16:30 Asia/Taipei, Monday-Friday (GitHub cron uses UTC).
    - cron: "30 8 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 00631l-prediction
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Restore prediction database
        uses: actions/cache/restore@v5
        with:
          path: artifacts/predictions.sqlite3
          key: predictions-${{ github.run_id }}
          restore-keys: |
            predictions-

      - name: Seed prediction database
        run: |
          mkdir -p artifacts
          if [ ! -f artifacts/predictions.sqlite3 ]; then
            cp predictions.sqlite3 artifacts/predictions.sqlite3
          fi

      - name: Run 00631L walk-forward analysis
        run: |
          set -o pipefail
          python scripts/predict.py 00631L.TW \
            --period 10y \
            --horizon 5 \
            --target 0.04 \
            --adverse -0.025 \
            --folds 5 \
            --database artifacts/predictions.sqlite3 \
            --output-json artifacts/validation.json \
            2>&1 | tee artifacts/predict.log

      - name: Save prediction database cache
        if: success()
        uses: actions/cache/save@v5
        with:
          path: artifacts/predictions.sqlite3
          key: predictions-${{ github.run_id }}

      - name: Upload analysis outputs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: 00631L-analysis-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Prepare public GET result
        run: cp artifacts/validation.json public/latest.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: public

  deploy:
    needs: predict
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GET result to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  notify:
    if: always()
    needs:
      - predict
      - deploy
    runs-on: ubuntu-latest

    steps:
      - name: Download analysis result
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: 00631L-analysis-${{ github.run_number }}-${{ github.run_attempt }}
          path: notification-result

      - name: Send Discord result notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PREDICT_RESULT: ${{ needs.predict.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PAGE_URL: https://s1710931008.github.io/yfinance/
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL secret is not configured; notification skipped"
            exit 0
          fi

          result_file="notification-result/validation.json"
          if [ -f "$result_file" ]; then
            market_date=$(jq -r '.latest_date // "資料不足"' "$result_file")
            market_price=$(jq -r 'if (.latest_price | type) == "number" then (.latest_price | tostring) else "資料不足" end' "$result_file")
            action=$(jq -r '.action // "資料不足"' "$result_file")
            validation=$(jq -r 'if .validation_snapshot.passed == true then "通過" elif .validation_snapshot.passed == false then "未通過" else "資料不足" end' "$result_file")
          else
            market_date="資料不足"
            market_price="資料不足"
            action="分析結果檔案不存在"
            validation="資料不足"
          fi

          content=$(printf '00631L 每日分析完成\n分析：%s｜部署：%s\n行情日期：%s｜目前價位：%s\n結論：%s｜正式驗證：%s\n查看儀表板：%s\n執行紀錄：%s\n本分析僅供研究與參考，不構成投資建議；00631L 為槓桿型 ETF，使用者應自行承擔交易風險與損益。' \
            "$PREDICT_RESULT" "$DEPLOY_RESULT" "$market_date" "$market_price" \
            "$action" "$validation" "$PAGE_URL" "$RUN_URL")
          payload=$(jq -n --arg content "$content" '{content: $content}')
          curl --fail-with-body --retry 3 --retry-delay 5 \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            "$DISCORD_WEBHOOK_URL"
